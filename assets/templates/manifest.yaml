item_alpha_postprocessing:
  method: Filled rounded rectangle plus complete protruding quantity digits; RGB and
    canvas unchanged.
  rounded_rectangle: inclusive x0,y0,x1,y1,radius; integer pixel-center circle equation
  digit_detection:
    x_fraction:
    - 0.3
    - 0.72
    y_fraction_start: 0.72
    y_end_exclusive: height - 1
    minimum_bgr_channel:
      purchased: 75
      other_states: 145
    max_channel_difference_exclusive: 40
    outline_dilation_kernel:
    - 5
    - 5
  confirmation_button_unchanged: true
