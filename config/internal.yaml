  shop_exit_button: {x: 172, y: 60}
  main_screen_wake: {x: 1161, y: 653}
  refresh_button: {x: 394, y: 1201}
  refresh_confirm_button: {x: 1356, y: 834}
  confirm_button: {x: 1485, y: 925}

statistics:
  # 首次部署后填写真实 HTTPS 服务根地址；留空时仅本地保存，不发送请求。
  api_base_url: "https://e7auto-shop-stats.e7auto-stats.workers.dev"

targets:
  - id: covenant_bookmark
    display_name: 圣约书签
    template: covenant_bookmark
    confirm_template: covenant_bookmark_confirm
    purchased_template: covenant_bookmark_purchased
    user_selectable: false
  - id: mystic_medal
    display_name: 神秘奖牌
    template: mystic_medal
    confirm_template: mystic_medal_confirm
    purchased_template: mystic_medal_purchased
    user_selectable: false
  - id: friendship_points
    display_name: 友情点数
    template: friendship_points
    confirm_template: friendship_points_confirm
    purchased_template: friendship_points_purchased
    user_selectable: true
slots:
  - id: top_1
    screen: top
    order: 0
    item_roi: {x: 970, y: 145, width: 240, height: 220}
    buy_point: {x: 2091, y: 299}
  - id: top_2
    screen: top
    order: 1
    item_roi: {x: 970, y: 408, width: 240, height: 220}
    buy_point: {x: 2091, y: 562}
  - id: top_3
    screen: top
    order: 2
    item_roi: {x: 970, y: 671, width: 240, height: 220}
    buy_point: {x: 2091, y: 825}
  - id: top_4
    screen: top
    order: 3
    item_roi: {x: 970, y: 934, width: 240, height: 220}
    buy_point: {x: 2091, y: 1087}
  - id: bottom_5
    screen: bottom
    order: 4
    item_roi: {x: 970, y: 803, width: 240, height: 220}
    buy_point: {x: 2091, y: 957}
  - id: bottom_6
    screen: bottom
    order: 5
    item_roi: {x: 970, y: 1066, width: 240, height: 220}
    buy_point: {x: 2091, y: 1220}

scroll:
  cursor_point: {x: 1500, y: 650}
  delta: -120
  repetitions: 6
  interval_ms: 10
  settle_ms: 800
  minimum_settle_ms: 100
  settle_poll_interval_ms: 100
  stable_observations: 2
  maximum_pairwise_shift_px: 1.0
  minimum_phase_response: 0.80
  downsample_factor: 4
  minimum_upward_shift_px: 300
  difference_threshold: 8
  minimum_changed_fraction: 0.20
  maximum_horizontal_shift_px: 4.0
  minimum_overlap_fraction: 0.50
  minimum_content_score: 0.75
  minimum_content_stddev: 8.0
  content_alignment_tolerance_px: 4.0

timing:
  capture_frame_timeout_ms: 1000
  capture_recovery_timeout_ms: 3000
  capture_rebuild_cooldown_ms: 60000
  capture_rebuild_window_ms: 600000
  capture_rebuild_max_attempts: 3
  poll_interval_ms: 100
  entry_timeout_ms: 5000
  scan_timeout_ms: 3000
  dialog_timeout_ms: 3000
  purchase_result_timeout_ms: 5000
  refresh_timeout_ms: 10000
  stable_frames: 3

vision:
  candidate_cache_mib: 64
  default_confidence: 0.90
  anchor_confidence: 0.93
  entry_thresholds:
    shop: {color: 0.93, structure: 0.80}
    penguin: {color: 0.96, structure: 0.80}
  penguin_control_confidence: 0.96
  penguin_price_digit_confidence: 0.84
  penguin_price_digit_margin: 0.06
  # Per-side button search padding: x=horizontal, y=vertical.
  purchased_button_padding: {x: 18, y: 16}
  # Relative to the detected purchase button's top-left, not screen coordinates.
  penguin_price_rect: {x: 115, y: 25, width: 210, height: 62}
  sky_stone_digit_confidence: 0.80
  sky_stone_digit_margin: 0.08
  sky_stone_digits_offset: {x: 57, y: 16}

overlay:
  offset: {x: -252, y: -145}

logging:
  keep_days: 7
  keep_runs: 20
  max_file_mb: 10
  backup_count: 3
  max_total_mb: 500

# Shared date-change workflow; loaded only by features that explicitly opt in.
daily_reset:
  observe_ms: 2000
  poll_ms: 100
  stable_frames: 3
  page_timeout_ms: 15000
  close_retry_ms: 1500
  close_max_attempts: 3
  templates:
    date_change_title:
      roi:
      - 850
      - 280
      - 620
      - 230
      threshold: 0.96
      structure_threshold: 0.8
    date_change_close:
      roi:
      - 970
      - 760
      - 390
      - 230
      threshold: 0.96
      structure_threshold: 0.8
    daily_signin_confirm:
      roi:
      - 1600
      - 1080
      - 650
      - 220
      threshold: 0.96
      structure_threshold: 0.8
    login_reward_title:
      roi:
      - 800
      - 140
      - 720
      - 240
      threshold: 0.96
      structure_threshold: 0.8
    login_reward_close:
      roi:
      - 970
      - 1180
      - 410
      - 126
      threshold: 0.93
      structure_threshold: 0.8
    buff_effect_title:
      roi: [280, 170, 450, 170]
      threshold: 0.96
      structure_threshold: 0.8

  component_matching:
    tolerance: [6, 8]
    templates:
      login_reward_close:
        primary: [39, 0, 127, 34]
        secondary: [0, 0, 39, 34]

penguin_component_matching:
  tolerance: [6, 8]
  templates:
    altar_close:
      primary: [41, 0, 137, 44]
      secondary: [0, 0, 41, 44]
