  refresh_confirm_prompt: {x: 925, y: 540, width: 475, height: 90}
  refresh_confirm_button: {x: 1150, y: 755, width: 415, height: 160}
  inventory_list: {x: 950, y: 110, width: 1320, height: 1180}
  inventory_content: {x: 950, y: 110, width: 900, height: 1180}
  confirm_item: {x: 880, y: 535, width: 220, height: 225}
  confirm_button: {x: 1385, y: 860, width: 200, height: 130}
  purchase_result: {x: 975, y: 210, width: 400, height: 300}
  sky_stone_icon: {x: 0, y: 0, width: 2322, height: 110}
  sky_stone_digits: {x: 0, y: 0, width: 2322, height: 45}
