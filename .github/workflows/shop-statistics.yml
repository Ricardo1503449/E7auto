name: Shop community statistics snapshot

on:
  schedule:
    - cron: '17 18 * * *'  # 02:17 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shop-statistics-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: ${{ vars.SHOP_STATS_API_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch and render one consistent aggregate snapshot
        env:
          SHOP_STATS_API_URL: ${{ vars.SHOP_STATS_API_URL }}
        run: >-
          python -m scripts.cloudflare.shop_stats.snapshot
          --endpoint "$SHOP_STATS_API_URL"
          --output-dir "$RUNNER_TEMP/shop-statistics-snapshot"
      - name: Publish only the stats branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -m scripts.cloudflare.shop_stats.publish
          --snapshot-dir "$RUNNER_TEMP/shop-statistics-snapshot"
          --publish
