[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "e7auto"
version = "1.2.0"
description = "Fail-closed, calibrated Windows shop automation UI"
requires-python = "==3.12.*"
dependencies = [
  "numpy==2.5.2",
  "opencv-python-headless==5.0.0.93",
  "PySide6==6.11.2",
  "pywin32==312",
  "PyYAML==6.0.3",
  "typing_extensions==4.16.0",
  "winrt-runtime==3.2.1",
  "winrt-Windows.Foundation==3.2.1",
  "winrt-Windows.Graphics==3.2.1",
  "winrt-Windows.Graphics.Capture==3.2.1",
  "winrt-Windows.Graphics.Capture.Interop==3.2.1",
  "winrt-Windows.Graphics.DirectX==3.2.1",
  "winrt-Windows.Graphics.DirectX.Direct3D11==3.2.1",
  "winrt-Windows.Graphics.DirectX.Direct3D11.Interop==3.2.1",
  "winrt-Windows.Graphics.Imaging==3.2.1",
]

[project.optional-dependencies]
dev = [
  "Nuitka==4.1.3",
  "ordered-set==4.1.0",
  "pytest==9.1.1",
  "zstandard==0.25.0",
]

[project.scripts]
e7auto = "e7auto.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
